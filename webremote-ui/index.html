<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AudioCrate</title>
    <!-- viewport-fit=cover + Ionic's safe-area vars keep content clear of the
         notch and the home indicator when launched from the home screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- "Add to Home Screen" → launches chromeless, like a native app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AudioCrate" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
